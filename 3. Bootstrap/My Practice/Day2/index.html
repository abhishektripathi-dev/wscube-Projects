<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Bootstrap demo</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/media.css" />
    </head>
    <body>
        <header class="container-fluid py-1 shadow-lg position-sticky top-0">
            <div class="container">
                <div class="row align-items-center">
                    <figure
                        class="col-lg-6 col-12 text-lg-start text-center my-0"
                    >
                        <img
                            src="images/Ws_Logo 1.svg"
                            class="img-fluid imgLogo"
                            alt=""
                        />
                    </figure>
                    <div class="col-lg-6">
                        <div class="btn-outer d-flex gap-3 justify-content-end">
                            <button
                                class="btn btn btn-outline-success btnWhatsapp"
                            >
                                <i class="fa-brands fa-whatsapp"></i> Chat with
                                Us
                            </button>
                            <button class="btn btnCall">
                                <i class="fa-solid fa-phone"></i> Call Us
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <section class="container-fluid py-lg-5 py-sm-4 py-3">
            <div class="container">
                <div class="row">
                    
                </div>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
