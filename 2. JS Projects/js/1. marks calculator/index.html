<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Student Report Card</title>

        <link rel="stylesheet" href="style.css" />

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    </head>

    <body>
        <button class="themeBtn" onclick="toggleTheme()">🌙 Dark Mode</button>

        <div class="container" id="reportCard">
            <h1>Student Report Card</h1>

            <div class="row">
                <label>Student Name</label>
                <input type="text" id="name" />
            </div>

            <div class="row">
                <label>Maths</label>
                <input type="number" id="maths" />
            </div>

            <div class="row">
                <label>Science</label>
                <input type="number" id="science" />
            </div>

            <div class="row">
                <label>English</label>
                <input type="number" id="english" />
            </div>

            <div class="row">
                <label>Hindi</label>
                <input type="number" id="hindi" />
            </div>

            <div class="row">
                <label>S.St</label>
                <input type="number" id="sst" />
            </div>

            <button onclick="calculate()">Generate Result</button>

            <div class="result">
                <p>Name: <span id="studentName"></span></p>
                <p>Total: <span id="total"></span></p>
                <p>Percentage: <span id="percentage"></span></p>

                <div class="progress">
                    <div id="bar"></div>
                </div>

                <p>Division: <span id="division"></span></p>
                <p>Grade: <span id="grade"></span></p>
            </div>

            <canvas id="chart"></canvas>

            <div class="actions">
                <button onclick="downloadPDF()">Download PDF</button>
                <button onclick="window.print()">Print</button>
            </div>

            <h3>Previous Results</h3>
            <ul id="history"></ul>
        </div>

        <script src="script.js"></script>
    </body>
</html>
