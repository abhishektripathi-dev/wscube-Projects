<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lightbox Gallery</title>
        <style>
            body {
                font-family: Arial;
                background: #f4f4f4;
                text-align: center;
            }

            .title {
                margin: 30px;
            }

            .gallery {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 15px;
                width: 80%;
                margin: auto;
            }

            .gallery img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                cursor: pointer;
                border-radius: 8px;
                transition: 0.3s;
            }

            .gallery img:hover {
                transform: scale(1.05);
            }

            /* LIGHTBOX */

            #lightbox {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.9);
                display: none;
                justify-content: center;
                align-items: center;
            }

            #lightbox-img {
                max-width: 80%;
                max-height: 80%;
                border-radius: 10px;
            }

            #close {
                position: absolute;
                top: 30px;
                right: 40px;
                font-size: 40px;
                color: white;
                cursor: pointer;
            }
        </style>
    </head>

    <body>
        <h2 class="title">Image Gallery</h2>

        <div class="gallery">
            <img
                src="https://uptownskylla.in/wp-content/uploads/2019/10/05-Contener-No-3rd-06.jpg"
                class="gallery-img"
            />
            <img
                src="https://uptownskylla.in/wp-content/uploads/2019/10/05-Contener-No-3rd-08.jpg"
                class="gallery-img"
            />
            <img
                src="https://uptownskylla.in/wp-content/uploads/2019/10/05-Contener-No-3rd-10.jpg"
                class="gallery-img"
            />
            <img
                src="https://uptownskylla.in/wp-content/uploads/2019/10/05-Contener-No-3rd-05.jpg"
                class="gallery-img"
            />
            <img
                src="https://uptownskylla.in/wp-content/uploads/2022/09/Under-Interior-Design-4-1400x700.jpg"
                class="gallery-img"
            />
            <img
                src="https://uptownskylla.in/wp-content/uploads/2019/10/05-Container-No-3rd-01.jpg"
                class="gallery-img"
            />
        </div>

        <!-- Lightbox -->
        <div id="lightbox">
            <span id="close">&times;</span>

            <img id="lightbox-img" />
        </div>

        <script>
            const galleryImages = document.querySelectorAll(".gallery-img");
            const lightbox = document.getElementById("lightbox");
            const lightboxImg = document.getElementById("lightbox-img");
            const closeBtn = document.getElementById("close");

            galleryImages.forEach(function (img) {
                img.addEventListener("click", function () {
                    lightbox.style.display = "flex";

                    lightboxImg.src = this.src;
                });
            });

            closeBtn.addEventListener("click", function () {
                lightbox.style.display = "none";
            });

            lightbox.addEventListener("click", function (e) {
                if (e.target !== lightboxImg) {
                    lightbox.style.display = "none";
                }
            });
        </script>
    </body>
</html>
