        //Promise--  API
        //Promise --- DataBase
        //Promise --- File Handling
        //Promise --- API

        //Promise --- Fullfilled
        //Promise --- Rejected
        //Promise --- Pending
        let loginStatus = false;

        let loginPromise = new Promise((resolve, reject) => {
            if (loginStatus) {
                resolve({ status: true, message: "Login Done" });
            } else {
                reject({
                    status: false,
                    message: "Invalid username or Password",
                });
            }
        });

        let checkLogin = async () => {
            try {
                let data = await loginPromise; //Success // Fullfilled
                console.log(data);
            } catch (err) {
                console.log(err);
            }
        };

        checkLogin();

        loginPromise
            .then((apiSuccessRes) => {
                console.log(apiSuccessRes);
            })
            .catch((error) => {
                console.log(error);
            });

        // console.log(loginPromise);

    </script>
