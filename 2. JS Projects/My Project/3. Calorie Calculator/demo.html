<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Calorie Calculator</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "Segoe UI", sans-serif;
            }

            body {
                background: linear-gradient(135deg, #1e293b, #0f172a);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
                color: #fff;
            }

            .container {
                background: #1e293b;
                width: 100%;
                max-width: 500px;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            }

            h1 {
                text-align: center;
                margin-bottom: 20px;
                font-weight: 600;
            }

            .form-group {
                margin-bottom: 15px;
            }

            label {
                display: block;
                margin-bottom: 6px;
                font-size: 14px;
            }

            input,
            select {
                width: 100%;
                padding: 10px;
                border-radius: 6px;
                border: none;
                outline: none;
                font-size: 14px;
            }

            button {
                width: 100%;
                padding: 12px;
                margin-top: 10px;
                border: none;
                border-radius: 6px;
                background: #3b82f6;
                color: #fff;
                font-size: 16px;
                cursor: pointer;
                transition: 0.3s;
            }

            button:hover {
                background: #2563eb;
            }

            .result {
                margin-top: 20px;
                padding: 15px;
                background: #0f172a;
                border-radius: 8px;
                display: none;
            }

            .result h3 {
                margin-bottom: 10px;
            }

            .error {
                color: #f87171;
                font-size: 13px;
                margin-top: 5px;
            }

            @media (max-width: 480px) {
                .container {
                    padding: 20px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1>Calorie Calculator</h1>

            <form id="calorieForm">
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" required />
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender" required>
                        <option value="">Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" required />
                </div>

                <div class="form-group">
                    <label>Height (cm)</label>
                    <input type="number" id="height" required />
                </div>

                <div class="form-group">
                    <label>Activity Level</label>
                    <select id="activity" required>
                        <option value="">Select</option>
                        <option value="1.2">Sedentary</option>
                        <option value="1.375">Light Exercise</option>
                        <option value="1.55">Moderate Exercise</option>
                        <option value="1.725">Active</option>
                        <option value="1.9">Very Active</option>
                    </select>
                </div>

                <button type="submit">Calculate</button>
            </form>

            <div class="result" id="result">
                <h3>Result</h3>
                <p id="bmr"></p>
                <p id="maintenance"></p>
                <p id="loss"></p>
                <p id="gain"></p>
            </div>
        </div>

        <script>
            const form = document.getElementById("calorieForm");
            const resultBox = document.getElementById("result");

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                const age = parseInt(document.getElementById("age").value);
                const gender = document.getElementById("gender").value;
                const weight = parseFloat(
                    document.getElementById("weight").value,
                );
                const height = parseFloat(
                    document.getElementById("height").value,
                );
                const activityFactor = parseFloat(
                    document.getElementById("activity").value,
                );

                if (!age || !gender || !weight || !height || !activityFactor) {
                    alert("Please fill all fields correctly.");
                    return;
                }

                let bmr;

                if (gender === "male") {
                    bmr = 10 * weight + 6.25 * height - 5 * age + 5;
                } else {
                    bmr = 10 * weight + 6.25 * height - 5 * age - 161;
                }

                const maintenanceCalories = bmr * activityFactor;
                const weightLossCalories = maintenanceCalories - 500;
                const weightGainCalories = maintenanceCalories + 500;

                document.getElementById("bmr").innerText =
                    "BMR: " + bmr.toFixed(2) + " calories/day";

                document.getElementById("maintenance").innerText =
                    "Maintenance Calories: " +
                    maintenanceCalories.toFixed(2) +
                    " calories/day";

                document.getElementById("loss").innerText =
                    "Weight Loss Calories (~0.5kg/week): " +
                    weightLossCalories.toFixed(2) +
                    " calories/day";

                document.getElementById("gain").innerText =
                    "Weight Gain Calories (~0.5kg/week): " +
                    weightGainCalories.toFixed(2) +
                    " calories/day";

                resultBox.style.display = "block";
            });
        </script>
    </body>
</html>
