<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Show / Hide</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                margin-top: 60px;
            }
            .container {
                background-color: #ccc;
                width: 300px;
                height: 100px;
                display: flex;
                justify-content: center;
                align-items: center;
                border-radius: 8px;
                box-shadow: 0px 0px 5px 2px hsl(0, 30%, 92%);
            }

            .input-box {
                width: 100%;
                display: flex;
                gap: 5px;
                padding: 0px 10px;
            }

            .input-box input {
                flex: 1;
                padding: 8px;
            }

            .input-box button {
                padding: 8px 12px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="input-box">
                <input
                    type="password"
                    name=""
                    id=""
                    placeholder="Enter your Password"
                />
                <button>Show</button>
            </div>
        </div>

        <script>
            let inputEl = document.querySelector(".input-box input");
            let buttonEl = document.querySelector(".input-box button")

            buttonEl.addEventListener("click", (e)=>{
                if(inputEl.type == "password"){
                    inputEl.type="text"
                    buttonEl.innerText = "Hide"
                }else{
                    inputEl.type="password"
                    buttonEl.innerText = "Show"
                }
            })
        </script>
    </body>
</html>
