<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Movie App</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- 🔹 Navbar -->
        <header class="navbar">
            <h1 class="logo">🎬 MovieApp</h1>
            <input type="text" placeholder="Search movies..." class="search" />
        </header>

        <!-- 🔹 Movies Grid -->
        <main class="movies-container">
            <!-- Movie Card -->
            <div class="movie-card">
                <img
                    src="https://images.unsplash.com/photo-1635805737707-575885ab0820?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8bW92aWUlMjBwb3N0ZXJ8ZW58MHx8MHx8fDA%3D"
                    alt="movie"
                />
                <div class="movie-info">
                    <h3>Inception</h3>
                    <span class="rating">⭐ 8.8</span>
                    <p></p>
                </div>
            </div>
        </main>

        <script src="script.js"></script>
    </body>
</html>
