<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title class="notranslate">Language Translator</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">

            <div class="header-box">
                <span
                    class="notranslate"
                    style="font-weight: bold; font-size: 1.2rem"
                    >Quick Translator</span
                >
                <div id="google_translate_element"></div>
            </div>

            <label class="notranslate">English Text:</label>
            <textarea
                id="engInput"
                class="notranslate"
                placeholder="Type your English text here..."
                oninput="syncText()"
            ></textarea>

            <div class="arrow-down">↓</div>

            <label class="notranslate">Translated Result:</label>
            
            <div class="output-box">
                <span id="translateMe"
                    >Your translation will appear here...</span
                >
            </div>
        </div>

        <script
            type="text/javascript"
            src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
        ></script>
        <script src="script.js"></script>
    </body>
</html>
